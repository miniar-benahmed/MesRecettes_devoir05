<div class="container">
    <div>
        <h2>Modifier une recette :</h2>
    </div>

    <form (ngSubmit)="updateRecette()">

        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Identifiant</label>
            <input type="number" [(ngModel)]="currentRecette.idRecette" name="idRecette" class="form-control" readonly>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom de la recette</label>
            <input type="text" [(ngModel)]="currentRecette.nomRecette" name="nomRecette" class="form-control" required>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Temps de préparation (minutes)</label>
            <input type="number" [(ngModel)]="currentRecette.tempsPreparation" name="tempsPreparation" class="form-control" min="1" required>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Difficulté</label>
            <select [(ngModel)]="currentRecette.difficulte" name="difficulte" class="form-control" required>
        <option value="Facile">Facile</option>
        <option value="Moyenne">Moyenne</option>
        <option value="Difficile">Difficile</option>
      </select>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date d'ajout</label>
            <input type="date" name="dateAjout" class="form-control" [ngModel]="currentRecette.dateAjout | date:'yyyy-MM-dd'" (ngModelChange)="onDateChange($event)">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mt-2">
            <label>Pays d'origine</label>
            <select [(ngModel)]="updateidpaysOrigine" name="paysOrigine" class="form-control" required>
        <option [ngValue]="undefined" disabled>Choisir un pays</option>
        @for (p of paysOrigine; track p.idpaysOrigine) {
          <option [ngValue]="p.idpaysOrigine">
            {{ p.nompaysOrigine }}
          </option>
        }
      </select>
        </div>

        <div class="mt-2">
            <button type="submit" class="btn btn-success">Enregistrer les modifications</button>
            <a routerLink="/recettes" class="btn btn-secondary ms-2">Retour à la liste</a>
        </div>

    </form>
</div>
