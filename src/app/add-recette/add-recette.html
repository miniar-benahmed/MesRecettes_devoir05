<h2>
    Ajouter une recette</h2>

<form (ngSubmit)="addRecette()">

    <p>
        <label>Identifiant :</label>
        <input type="number" [(ngModel)]="newRecette.idRecette" name="idRecette" required>
    </p>

    <p>
        <label>Nom de la recette :</label>
        <input type="text" [(ngModel)]="newRecette.nomRecette" name="nomRecette" required>
    </p>

    <p>
        <label>Temps de préparation (minutes) :</label>
        <input type="number" [(ngModel)]="newRecette.tempsPreparation" name="tempsPreparation" min="1" required>
    </p>

    <p>
        <label>Difficulté :</label>
        <select [(ngModel)]="newRecette.difficulte" name="difficulte" required>
      <option value="Facile">Facile</option>
      <option value="Moyenne">Moyenne</option>
      <option value="Difficile">Difficile</option>
    </select>
    </p>

    <p>
        <label>Pays d'origine :</label>

        <select [(ngModel)]="newRecette.paysOrigine" name="paysOrigine" required>

    <option value="">Choisir un pays</option>
    <option value="Tunisie">Tunisie</option>
    <option value="Italie">Italie</option>
    <option value="France">France</option>
    <option value="Maroc">Maroc</option>
    <option value="Turquie">Turquie</option>
  </select>
    </p>


    <button type="submit">Ajouter</button>

    <p>{{ message }}</p>

</form>

<p><a routerLink="/recettes">Retour à la liste</a></p>
